# Targets live here, not in the code: change the cut-off without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sleep-slo-config
  namespace: sleep-platform
  labels: {owner: sleep-platform, cost-centre: personal-learning}
data:
  config.json: |
    {"target_sleep_minutes": 450, "bedtime_cutoff": "00:30", "slo_target": 0.80, "window_days": 30}
